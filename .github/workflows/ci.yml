name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

defaults:
    run:
        working-directory: hossias

env:
    NODE_VERSION: 22

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: yarn
                  cache-dependency-path: hossias/yarn.lock

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Type check
              run: yarn typecheck

            - name: Lint
              run: yarn lint

            - name: Formatting
              run: yarn format:check

            - name: Spell check
              run: yarn spellcheck

    build:
        name: Build
        needs: quality
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: yarn
                  cache-dependency-path: hossias/yarn.lock

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build
              run: yarn build

            - name: Bundle size report
              run: |
                  {
                    echo "### Build output"
                    echo '| File | Size | Gzip |'
                    echo '| --- | ---: | ---: |'
                    find dist -type f ! -name '*.map' | sort | while read -r f; do
                      echo "| \`${f#dist/}\` | $(du -h "$f" | cut -f1) | $(gzip -c "$f" | wc -c | awk '{printf "%.1fK", $1/1024}') |"
                    done
                  } >> "$GITHUB_STEP_SUMMARY"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: site
                  path: hossias/dist
                  retention-days: 7
