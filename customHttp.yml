# Amplify Hosting response headers (monorepo format: one entry per appRoot).
applications:
    - appRoot: hossias
      customHeaders:
          # Vite fingerprints everything in /assets, so browsers can keep it forever.
          - pattern: "/assets/*"
            headers:
                - key: Cache-Control
                  value: public, max-age=31536000, immutable
          - pattern: "**/*"
            headers:
                - key: Strict-Transport-Security
                  value: max-age=31536000
                - key: X-Content-Type-Options
                  value: nosniff
                - key: Referrer-Policy
                  value: strict-origin-when-cross-origin
